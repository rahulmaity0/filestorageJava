server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/filestorage
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate configuration (auto create tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Optional, accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom App Properties
# JWT signing key (256-bit, HMAC-SHA256). The default is for local development only; set JWT_SECRET anywhere else.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# File Storage Paths
app.storage.upload-dir=uploads
app.storage.thumbnail-dir=uploads/thumbnails
app.storage.max-file-size=10485760 

# Multipart Configuration (Spring Boot)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
